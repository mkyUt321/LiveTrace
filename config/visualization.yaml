# Dedicated config for NetAnim qualitative visualization -- not used for any
# reported result (see config/scale_sweep.yaml for that). Differs from the
# main sweep config in two ways:
#
#   1. attacker.count is 1, not 2. The main sweep needs 2 actors so
#      reid_precision is a meaningful metric (docs/summaries/phase6), but two
#      actors' bursts can land close together in time, which makes the
#      burst-by-burst NetAnim reset (grey -> red/pale-red -> purple,
#      purple -> blue on the next burst) hard to read, since two chains can
#      be mid-highlight at once. A single actor keeps bursts strictly
#      sequential (period_s=60 >> live_window_s + accumulation/hop delays),
#      so each burst's highlighted path is visually isolated from the next.
#   2. background.enabled is false. NetAnim's packet-arrow rendering has no
#      per-flow color (the viewer draws every arrow blue regardless of what
#      it's carrying, and the XML packet element has no color field), so the
#      only way to make the moving arrows read as "the attack" is to make
#      sure nothing else is moving. This lowers the correlator's difficulty
#      versus the main sweep (no ambient noise to reject), which is fine
#      here since this config feeds no reported metric -- only
#      config/scale_sweep.yaml (background on) does.
#
# n=20 keeps physical/overlay routes short enough to read on screen; longer
# runs for other N should reuse config/scale_sweep.yaml instead.
#
# Usage:
#   ./ns3 run "scratch/livetrace-sim --config=.../config/visualization.yaml \
#       --outdir=.../results --seed=1 --n=20"

seed: 1
num_seeds: 1

topology:
  model: erdos_renyi
  n: 20
  p: 0.12
  avg_degree: 8
  max_regen_attempts: 50

attacker:
  count: 1
  period_s: 60.0
  burst_s: 5.0
  chain_length_min: 2
  chain_length_absolute_cap: 40
  chain_length_factor: 1.2
  packets_per_burst: 80
  relay_pool_fraction: 0.35

background:
  enabled: false   # off so the only moving NetAnim arrows are attack packets; see header comment
  rate_pps: 0.05   # kept for reference / easy re-enabling
  packet_size_bytes: 512

window:
  live_window_s: 5.0

correlation:
  enabled: true
  method: zhang_paxson
  on_threshold_pps: 1.0
  bucket_s: 0.05
  min_on_off_transitions: 3
  score_threshold: 0.5
  max_lag_buckets: 3

traceback:
  accumulation_delay_s: 2.0
  hop_delay_s: 0.6
  max_hops: 40

reidentification:
  periodicity_tolerance_s: 5.0
  fingerprint_weight: 0.15
  timing_weight: 0.45
  periodicity_weight: 0.40
  cluster_score_threshold: 0.5

sim:
  stop_time_s: 300.0    # 5 periods -> ~5 bursts, enough to see the reset/origin-color cycle
