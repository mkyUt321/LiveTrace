# LiveTrace default configuration.
# Valid YAML (parseable by PyYAML on the analysis side); the C++ side uses a
# restricted-subset parser (contrib/livetrace/helper/config-loader.*) that only
# understands flat scalars and two levels of nesting, so keep this file within
# that shape when editing.

seed: 1
num_seeds: 20

topology:
  model: erdos_renyi   # fixed generator model for the whole project; see docs/summaries for rationale
  n: 50                # node count (primary scale axis; swept in Phase 4/6)
  p: 0.12               # edge probability, used only when avg_degree below is 0
  avg_degree: 8          # PREFERRED over p (see docs/summaries/phase6): derives
                          # p = avg_degree/(n-1) so mean degree -- and mesh
                          # diameter, which then grows as ~log N -- stays
                          # constant across an N sweep instead of the graph
                          # getting relatively denser (diameter flat) as N grows
                          # with a fixed p. Set to 0 to fall back to fixed p.
  max_regen_attempts: 50 # resample if disconnected

attacker:
  count: 1              # single moving-origin attacker per the project spec; the
                         # re-id engine still discovers this via clustering, it is
                         # not told count in advance. See config/scale_sweep.yaml
                         # and config/phase3_reid_test.yaml for multi-actor runs.
  period_s: 420.0
  burst_s: 5.0
  chain_length_min: 2          # floor, independent of diameter
  chain_length_absolute_cap: 40 # safety ceiling so a huge diameter can't runaway
  chain_length_factor: 1.2      # chain length target = round(factor * diameter);
                                 # this is what makes traceback depth actually grow
                                 # with N -- see docs/summaries/phase6 for why a
                                 # fixed [min,max] range decoupled difficulty from N
  packets_per_burst: 80
  relay_pool_fraction: 0.35  # each actor reuses relays only from its own random
                              # subset of this size -- models semi-persistent
                              # stepping-stone infrastructure and is what gives
                              # Phase 3's path-convergence signal real content

background:
  enabled: true
  rate_pps: 0.05          # PER NODE; driver multiplies by N so ambient density
                           # per node stays roughly constant across the N sweep.
                           # Kept small because it's an arrival rate of new
                           # *sessions* (each several packets), and aggregate
                           # rate otherwise grows uncomfortably large by N=320.
  packet_size_bytes: 512

window:
  live_window_s: 5.0    # the live traceback window central to the project

correlation:
  enabled: true
  method: zhang_paxson
  on_threshold_pps: 1.0  # rate above which an interval counts as ON
  bucket_s: 0.05         # ON/OFF bucketing resolution
  min_on_off_transitions: 3
  score_threshold: 0.5
  max_lag_buckets: 3     # small-misalignment search window (relay delay/jitter)

traceback:
  accumulation_delay_s: 2.0  # let this much of the burst accumulate before the first correlation
  hop_delay_s: 0.6            # additional cost paid at each subsequent hop -- this is what makes
                               # hop count trade off against the live window budget
  max_hops: 40                 # safety cap matching chain_length_absolute_cap; the live window is
                               # the real stopping condition in practice (see phase6: at large N
                               # with diameter-scaled chains, the window is expected to bind)

reidentification:
  periodicity_tolerance_s: 5.0
  fingerprint_weight: 0.15
  timing_weight: 0.45
  periodicity_weight: 0.40
  cluster_score_threshold: 0.5

sim:
  stop_time_s: 900.0     # a bit over 2 attack periods for small-N sanity runs

sweep:
  n_values: [20, 40, 80, 160, 320]
  seeds: [1, 2, 3, 4, 5]  # reduced from 10 after measuring wall-clock cost per
                           # cell (N=320 ~7.5min/seed even with nix-vector
                           # routing); see docs/summaries/phase4 for the tradeoff
